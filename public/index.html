<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Lab tools</title>
  <link href="style.css" rel="stylesheet" />
</head>

<body>
  <h1>Media Lab tools</h1>

  <h2>Whomever couldst thou be?</h2>
  <div class="container">
    <input type="text" id="studentNumber" placeholder="Student number" /><br />
    <input type="text" id="firstName" placeholder="First name" /><br />
  </div>
  <p id="message"></p>

  <h2>Add a tool</h2>
  <form class="container">
    <input type="text" id="toolName" placeholder="Name of the tool" /><br />
    <input type="text" id="toolDescription" placeholder="Description" /><br />
    <button type="submit" id="submitForm">Add</button>
  </form>

  <h2>Tools</h2>
  <div id="toolList">
  </div>
  <!-- script.js is compiled from script.ts by "npm run compile" -->
  <script src="script.js" type="module"></script>
</body>

</html>
